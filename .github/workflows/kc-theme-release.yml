name: Release Keycloak Theme

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
        type: string

concurrency:
  group: kc-theme-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: kc-theme-v${{ inputs.version }}
      # Fixed, floating tag the Keycloak deployment pulls from — NOT GitHub's
      # generic "latest" release, which is repo-wide and would get hijacked
      # by this repo's unrelated app release.yml (tag v<version>) the next
      # time someone cuts an app release after a theme release.
      LATEST_TAG: kc-theme-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version not already tagged
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Bump the version."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kc-themes/package-lock.json

      - name: Set up Java (Maven, used by `keycloakify build` to package the jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: kc-themes
        run: npm ci

      - name: Build the theme jar
        working-directory: kc-themes
        run: npm run build-keycloak-theme

      - name: Rename the jar to a stable asset name
        # `keycloakify build` names its output after the Keycloak version
        # range it targets (e.g. keycloak-theme-for-kc-all-other-versions.jar
        # covers the KC 26.x this repo runs). Renaming it here gives the
        # release a fixed asset filename. Fails loudly with a clear message
        # if a keycloakify bump ever changes that naming, rather than a
        # cryptic "No such file" from `cp`.
        run: |
          SRC=kc-themes/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar
          if [ ! -f "$SRC" ]; then
            echo "Expected jar not found at $SRC — keycloakify's output naming" >&2
            echo "may have changed. Files actually produced:" >&2
            ls -la kc-themes/dist_keycloak/ >&2
            exit 1
          fi
          cp "$SRC" keycloak-theme.jar

      - name: Generate changelog
        run: |
          PREV=$(git tag -l 'kc-theme-v*' --sort=-v:refname | head -1)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
            HEADER="Initial release"
          else
            RANGE="$PREV..HEAD"
            HEADER="Changes since $PREV"
          fi

          {
            echo "## $HEADER"
            echo ""
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges -- kc-themes
          } > changelog.md

      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: changelog.md
          files: keycloak-theme.jar
          draft: false
          prerelease: false

      - name: Move the floating kc-theme-latest tag
        run: |
          git tag -f "$LATEST_TAG"
          git push origin "$LATEST_TAG" --force

      - name: Update the kc-theme-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: ${{ env.LATEST_TAG }}
          body: "Floating release — always points at the same jar as the most recent ${{ env.TAG }}. Pulled by .pipelines/deployment/keycloak/keycloak-deployment.yaml's pull-theme initContainer. Do not download this for anything version-pinned; use a specific kc-theme-v* release instead."
          files: keycloak-theme.jar
          draft: false
          prerelease: false
