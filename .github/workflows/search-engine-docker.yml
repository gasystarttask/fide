name: Build And Push Search Engine Image

on:
  pull_request:
    paths:
      - '.github/workflows/search-engine-docker.yml'
      - 'search-engine/**'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/search-engine-docker.yml'
      - 'search-engine/**'
  workflow_dispatch:

concurrency:
  group: search-engine-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Dependabot PRs can't push images (no access to secrets, and there's no
  # reason to publish one pre-merge anyway) — just prove `npm run build`
  # still succeeds so a bad bump is caught before merge instead of failing
  # the full docker/deploy pipeline after landing on main.
  validate-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search-engine
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: search-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (validation only — no image, no push, no deploy)
        run: npm run build
        env:
          OPENAI_API_KEY: dummy
          DATABASE_URL: mongodb://127.0.0.1:27017/bible_sg

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bible-chat-scholar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./search-engine
          file: ./search-engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AKS_AUTOMATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      # Deploys the exact sha-tagged image just built (not `latest`) so the
      # rollout is tied to this specific commit, not whatever `latest`
      # happens to point at when the node pulls it.
      - name: Deploy image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/bible-chat-scholar:sha-${GITHUB_SHA::7}"
          kubectl set image deployment/search-engine "search-engine=${IMAGE}"
          kubectl rollout status deployment/search-engine --timeout=180s