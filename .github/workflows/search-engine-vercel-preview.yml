name: Deploy Search Engine Preview (Vercel)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'search-engine/**'
      - '.github/workflows/search-engine-vercel-preview.yml'

concurrency:
  group: vercel-preview-search-engine-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_COMMENT_MARKER: '<!-- vercel-preview:search-engine -->'

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search-engine
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: search-engine/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `${marker}\n🔗 **Search-engine preview deployed:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Find preview comment
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (!existing) {
              core.setOutput('url', '');
              core.setOutput('comment_id', '');
              return;
            }
            const match = existing.body.match(/https:\/\/\S+/);
            core.setOutput('url', match ? match[0] : '');
            core.setOutput('comment_id', String(existing.id));

      - name: Remove preview deployment
        if: steps.find.outputs.url != ''
        run: vercel remove "${{ steps.find.outputs.url }}" --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Update PR comment
        if: steps.find.outputs.comment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.find.outputs.comment_id }},
              body: `${marker}\n🗑️ Search-engine preview deployment removed (PR closed).`,
            });
