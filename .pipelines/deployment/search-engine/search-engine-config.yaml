apiVersion: v1
kind: ConfigMap
metadata:
  name: search-engine-config
data:
  MONGODB_DB_NAME: "bible_sg"
  MONGODB_COLLECTION_NAME: "verses"
  # Cluster-internal — Meilisearch has no public ingress, only a ClusterIP Service.
  MEILISEARCH_URL: "http://meilisearch-service:7700"

  # Auth (Keycloak SSO) — AUTH_URL must be this app's own public origin
  # (needed for next-auth's redirect/callback URL construction), and
  # KEYCLOAK_ISSUER must be Keycloak's public URL, not an internal Service
  # address — see .pipelines/deployment/README.md's "Deploying Keycloak"
  # section for why.
  AUTH_TRUST_HOST: "true"
  AUTH_URL: "https://fide.rrahajason.space"
  KEYCLOAK_ISSUER: "https://auth.rrahajason.space/realms/bible-sg"
  # Not secret — the client secret (below, in search-engine-secret) is what
  # actually needs protecting.
  KEYCLOAK_CLIENT_ID: "search-engine"

  LLM_DEFAULT_PROVIDER: "openai"
  LLM_CHAT_PROVIDER: "openai"
  LLM_ROUTER_PROVIDER: "openai"
  LLM_GROUNDED_ANSWER_PROVIDER: "openai"
  LLM_EXTRACTION_PROVIDER: "openai"

  LLM_FALLBACK_ORDER_CHAT: "openai,gemini,copilot,ollama"
  LLM_FALLBACK_ORDER_ROUTER: "openai,gemini,copilot,ollama"
  LLM_FALLBACK_ORDER_GROUNDED_ANSWER: "openai,gemini,copilot,ollama"
  LLM_FALLBACK_ORDER_EXTRACTION: "openai,gemini,copilot,ollama"

  LLM_CHAT_MODEL: "gpt-4o-mini"
  LLM_ROUTER_MODEL: "gpt-4o-mini"
  LLM_GROUNDED_ANSWER_MODEL: "gpt-4o-mini"
  LLM_EXTRACTION_MODEL: "gpt-4o-mini"
  COPILOT_MODEL: "gpt-4o-mini"
