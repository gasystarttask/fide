apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
spec:
  replicas: 1
  # RollingUpdate (the default) would try to bring up a new pod before
  # killing the old one — impossible here since the PVC is ReadWriteOnce
  # and can only be mounted by one pod at a time, causing a permanent
  # deadlock (new pod stuck waiting on the volume, old pod never killed
  # because the new one never becomes ready). Recreate kills the old pod
  # first, avoiding the overlap entirely.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.12 # Use latest stable version
        env:
        - name: MEILI_ENV
          value: "production"
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch-secret
              key: MEILI_MASTER_KEY
        ports:
        - containerPort: 7700
        volumeMounts:
        - mountPath: /meili_data
          name: meili-data-vol
      volumes:
      - name: meili-data-vol
        persistentVolumeClaim:
          claimName: meilisearch-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch-service
spec:
  type: ClusterIP # cluster-internal only — no public Ingress
  ports:
  - port: 7700
    targetPort: 7700
  selector:
    app: meilisearch
