apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1 # single-node cluster — no HA to gain from more replicas here
  strategy:
    # Keycloak itself is stateless, but Recreate avoids two instances racing
    # the same Postgres schema migration on a rollout.
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # Pulls the latest released kc-themes login theme jar (see
      # .github/workflows/kc-theme-release.yml and kc-themes/README.md) into
      # a volume shared with the main container, rather than baking a custom
      # Keycloak image — consistent with this repo's "reference the official
      # image directly" approach for Meilisearch/Keycloak. Since the main
      # container runs `start` (non-optimized), Keycloak rebuilds providers
      # from /opt/keycloak/providers on every boot and picks up whatever jar
      # this initContainer just downloaded — including on the nightly
      # stop/start pod recreation, so the theme stays current automatically.
      initContainers:
      - name: pull-theme
        image: curlimages/curl:8.12.1
        command:
        - sh
        - -c
        # Tolerate no release existing yet (e.g. before kc-theme-release.yml
        # has ever run) — the main container must still start with
        # Keycloak's default look rather than being blocked by a failed
        # initContainer.
        - curl -fsSL https://github.com/gasystarttask/fide/releases/latest/download/keycloak-theme.jar -o /providers/theme.jar || echo "No kc-theme release found yet — starting with the default Keycloak theme."
        volumeMounts:
        - name: keycloak-providers
          mountPath: /providers
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7
        # Plain `start` (not `--optimized`) rebuilds providers on every boot —
        # slower, but --optimized requires a pre-baked custom image, which
        # this repo deliberately avoids (no docker-build workflow for
        # Keycloak/Postgres, same as Meilisearch: reference the official
        # image directly).
        args: ["start"]
        env:
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://keycloak-db-service:5432/keycloak"
        - name: KC_DB_USERNAME
          value: "keycloak"
        - name: KC_DB_PASSWORD
          # Same Secret Postgres itself uses — avoids keeping this password
          # in two places.
          valueFrom:
            secretKeyRef:
              name: keycloak-db-secret
              key: POSTGRES_PASSWORD
        # TLS terminates at ingress-nginx; Keycloak itself only ever speaks
        # plain HTTP internally.
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        # Fixed, not auto-detected: a request reaching Keycloak over an
        # internal Service URL must still get back a discovery document
        # advertising this public URL, or OIDC clients validating the
        # issuer will reject it.
        - name: KC_HOSTNAME
          value: "https://auth.rrahajason.space"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HEALTH_ENABLED
          value: "true"
        # Bootstrap admin — only takes effect once, against an empty DB.
        # Disable this account after creating a permanent admin (see
        # ../README.md's "Deploying Keycloak" section).
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "kcadmin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: http-mgmt
        volumeMounts:
        - name: keycloak-providers
          mountPath: /opt/keycloak/providers
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6 # non-optimized `start` is slow to come up
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: keycloak-providers
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: keycloak
